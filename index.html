<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wake</title>
<meta name="description" content="wake — an instrument for drawing the trace a line leaves as it moves through time.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 22a11 11 0 1 1 20-6' fill='none' stroke='%23d4462a' stroke-width='3' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<main class="app">
  <div class="stage">
    <canvas id="art" aria-label="the drawing"></canvas>
    <div class="handles"></div>
    <div class="fps" hidden></div>
    <div class="draw-hint">draw one stroke on the canvas</div>
    <div class="stage-bar">
      <div class="number"></div>
      <span class="spacer"></span>
      <button id="new-colour" title="a random colour design from the collection">✦ colour</button>
      <button id="new-ink" title="a random ink design, made for pen plotters">◯ ink</button>
      <button class="drift" hidden></button>
    </div>
  </div>
  <aside class="panel">
    <header>
      <h1>wake</h1>
      <p>the trace a line leaves as it moves through time</p>
      <nav><a href="case.html">how it was made →</a></nav>
    </header>
    <div class="panel-body"></div>
    <footer>
      <div class="budget"></div>
      <div class="actions">
        <button id="share">share</button><button id="png">png</button><button id="svg">svg</button><button id="video">video</button>
      </div>
      <p class="credit">Inspired by <a href="https://github.com/doersino/uji">uji</a> by Noah Doersing · <a href="credits.html">credits &amp; sources</a></p>
    </footer>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
